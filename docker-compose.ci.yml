# Local CI toolchain: Jenkins + SonarQube (+ PostgreSQL for Sonar).
#   docker compose -f docker-compose.ci.yml up -d
#
#   Jenkins   -> http://localhost:8080   (initial password: see command below)
#   SonarQube -> http://localhost:9000   (default login admin / admin)
#
#   docker exec aceest-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# Jenkins runs as root and mounts the host Docker socket so that pipeline
# stages can build and push images (docker-outside-of-docker).
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: aceest-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    container_name: aceest-sonarqube
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: aceest-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jenkins-home:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-db-data:
