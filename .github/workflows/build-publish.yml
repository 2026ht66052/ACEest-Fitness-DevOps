# ---------------------------------------------------------------------------
# FALLBACK / SAFETY NET — not a replacement for the Jenkins pipeline.
#
# The assignment requires Jenkins as the build server, and Jenkinsfile is the
# graded pipeline. This workflow exists for one reason: it builds and pushes
# the Docker images on GitHub's runners, so the Docker Hub deliverable is never
# blocked by not having Docker on your own machine. It also keeps running when
# your Codespace is stopped.
#
# Setup (repo -> Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      Docker Hub -> Account Settings -> Security -> New Access Token
#   SONAR_TOKEN          SonarQube Cloud token      (optional)
#   SONAR_ORGANIZATION   SonarQube Cloud org key    (optional)
# ---------------------------------------------------------------------------
name: tests-and-image

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      all_versions:
        description: "Build and push every version tag (1.0 … 3.2.4)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarQube needs full history for new-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests wsgi.py gunicorn.conf.py --output-file=flake8-report.txt --tee

      - name: Security scan (bandit)
        run: bandit -r app -f json -o bandit-report.json || true

      - name: Unit tests (pytest)
        run: |
          python -m pytest \
            --cov=app --cov-report=xml:coverage.xml --cov-report=term \
            --cov-fail-under=85 --junitxml=test-results.xml -v

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
            flake8-report.txt
            bandit-report.json

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.python.coverage.reportPaths=coverage.xml

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive the version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=3.2.4" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the current version
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:latest
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Populates the Docker Hub repository with the full version history that
      # the assignment asks for, without needing Docker locally.
      - name: Build and push every version
        if: ${{ inputs.all_versions }}
        run: |
          set -euo pipefail
          for v in 1.0 1.1 1.1.2 2.0.1 2.1.2 2.2.1 2.2.4 3.0.1 3.1.2 3.2.4; do
            echo "::group::aceest-fitness:$v"
            if git rev-parse --verify --quiet "refs/tags/v$v" >/dev/null; then
              git checkout --quiet "v$v"
            else
              echo "tag v$v missing — building from the default branch"
            fi
            docker build \
              --build-arg "APP_VERSION=$v" \
              --build-arg "GIT_COMMIT=$(git rev-parse --short HEAD)" \
              --build-arg "BUILD_DATE=$(date -u +%FT%TZ)" \
              -t "${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:$v" .
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:$v"
            git checkout --quiet "${GITHUB_SHA}"
            echo "::endgroup::"
          done
