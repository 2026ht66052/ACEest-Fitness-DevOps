apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-config
  namespace: aceest
  labels:
    app: aceest-fitness
data:
  DATABASE_PATH: "/data/aceest_fitness.db"
  LOG_LEVEL: "info"
  WEB_CONCURRENCY: "2"
  WEB_THREADS: "4"
---
# For the assignment a plain Secret is sufficient; in production this value
# would come from Sealed Secrets, External Secrets or a cloud KMS.
apiVersion: v1
kind: Secret
metadata:
  name: aceest-secret
  namespace: aceest
  labels:
    app: aceest-fitness
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-the-cluster"
