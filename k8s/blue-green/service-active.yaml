# ---------------------------------------------------------------------------
# STRATEGY 2 — BLUE-GREEN (part 3 of 3: the traffic switch)
#
# `aceest-fitness-active` is the only service users hit. The cut-over is a
# one-line selector patch, which is atomic and instantly reversible:
#
#   # promote green
#   kubectl -n aceest patch svc aceest-fitness-active \
#     -p '{"spec":{"selector":{"app":"aceest-fitness","color":"green"}}}'
#
#   # rollback to blue
#   kubectl -n aceest patch svc aceest-fitness-active \
#     -p '{"spec":{"selector":{"app":"aceest-fitness","color":"blue"}}}'
#
# The two preview services allow each colour to be smoke tested in isolation
# while it is not receiving production traffic.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-active
  namespace: aceest
  labels:
    app: aceest-fitness
    strategy: blue-green
  annotations:
    aceest.io/active-color: "blue"
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    color: blue          # <-- the live colour; patched by scripts/deploy.sh
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue-preview
  namespace: aceest
  labels: { app: aceest-fitness, strategy: blue-green }
spec:
  type: NodePort
  selector: { app: aceest-fitness, color: blue }
  ports:
    - { name: http, port: 80, targetPort: 5000, nodePort: 30082 }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-green-preview
  namespace: aceest
  labels: { app: aceest-fitness, strategy: blue-green }
spec:
  type: NodePort
  selector: { app: aceest-fitness, color: green }
  ports:
    - { name: http, port: 80, targetPort: 5000, nodePort: 30083 }
