# ---------------------------------------------------------------------------
# STRATEGY 2 — BLUE-GREEN (part 1 of 3: the BLUE deployment = current version)
#
# Two full environments run side by side. The `aceest-fitness-active` service
# selects exactly one colour; switching that selector moves 100% of traffic
# instantly, and switching it back is the rollback.
#
#   kubectl apply -f k8s/base/ -f k8s/blue-green/
#   ./scripts/deploy.sh --strategy blue-green --image <img> --version 3.2.4
#   ./scripts/rollback.sh --strategy blue-green          # flip back
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
  namespace: aceest
  labels:
    app: aceest-fitness
    color: blue
    strategy: blue-green
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-fitness
      color: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: serving
        color: blue
        track: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: 2026ht66052/aceest-fitness:3.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.1.2"
            - name: APP_TRACK
              value: "blue"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aceest-secret
                  key: SECRET_KEY
          envFrom:
            - configMapRef:
                name: aceest-config
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
