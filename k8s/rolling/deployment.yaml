# ---------------------------------------------------------------------------
# STRATEGY 1 — ROLLING UPDATE (zero downtime, built-in rollback)
#
#   kubectl apply -f k8s/base/ -f k8s/rolling/
#   kubectl -n aceest set image deploy/aceest-fitness app=<image>:<tag>
#   kubectl -n aceest rollout status deploy/aceest-fitness --timeout=180s
#   kubectl -n aceest rollout undo   deploy/aceest-fitness          # rollback
#   kubectl -n aceest rollout history deploy/aceest-fitness
#
# maxUnavailable: 0 guarantees that capacity never drops during the update, and
# the readiness probe gates each new pod before the old one is terminated.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
  namespace: aceest
  labels:
    app: aceest-fitness
    strategy: rolling
  annotations:
    kubernetes.io/change-cause: "initial rollout"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: serving
        track: stable
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:3.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.2.4"
            - name: APP_TRACK
              value: "stable"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aceest-secret
                  key: SECRET_KEY
          envFrom:
            - configMapRef:
                name: aceest-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aceest-fitness
  namespace: aceest
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aceest-fitness
  namespace: aceest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aceest-fitness
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
