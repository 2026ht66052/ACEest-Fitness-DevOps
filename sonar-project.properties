# SonarQube configuration for ACEest Fitness & Gym
# Run locally with:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>

sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness and Gym
sonar.projectVersion=3.2.4

# Sources and tests
sonar.sources=app,wsgi.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python specifics
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# The legacy Tkinter versions are kept for traceability only; they are not part
# of the deployed service and are excluded from analysis and duplication checks.
sonar.exclusions=legacy/**,htmlcov/**,**/__pycache__/**,.venv/**,docs/**
sonar.coverage.exclusions=tests/**,wsgi.py,gunicorn.conf.py
sonar.cpd.exclusions=tests/**

# Quality gate behaviour
sonar.qualitygate.wait=true

# ---------------------------------------------------------------------------
# SonarQube Cloud (sonarcloud.io) — free and unlimited for PUBLIC repositories,
# no credit card. Use this when you cannot self-host the SonarQube container.
# Uncomment and set your organization key (Sonar shows it after you import the
# repo). The project key it generates is usually <org>_<repo>.
# ---------------------------------------------------------------------------
# sonar.organization=YOUR_SONAR_ORG
# sonar.host.url=https://sonarcloud.io
